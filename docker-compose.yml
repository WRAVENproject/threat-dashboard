  #   image: opencti/connector-taxii2:7.260811.0
  #   environment:
  #     - OPENCTI_URL=http://opencti:8080
  #     - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
  #     - CONNECTOR_ID=${CONNECTOR_TAXII2_ID}
  #     - CONNECTOR_NAME=TAXII2
  #     - CONNECTOR_SCOPE=identity,malware,attack-pattern,indicator,report
  #     - CONNECTOR_TYPE=EXTERNAL_IMPORT
  #     - CONNECTOR_LOG_LEVEL=info
  #     - CONNECTOR_DURATION_PERIOD=PT60M
  #     - TAXII2_DISCOVERY_URL=<a real TAXII 2.1 discovery endpoint>
  #     - TAXII2_V21=true
  #     - TAXII2_COLLECTIONS=*.*
  #   restart: always
  #   networks:
  #     - backend

volumes:
  esdata: {}
  s3data: {}
  redisdata: {}
  amqpdata: {}

networks:
  backend:
    driver: bridge
  caddy:
    external: true